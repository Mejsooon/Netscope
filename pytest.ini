[pytest]
; Szukaj testów tylko w folderze tests/
testpaths = tests
; Dodaj katalog główny do ścieżki importów, żeby testy mogły robić "import app..."
pythonpath = .
; -ra: na końcu wypisz powody pominiętych/nieudanych testów
; --strict-markers: nieznany marker (np. literówka) to błąd, a nie cicho ignorowany test
addopts = -ra --strict-markers
